_format_version: "2.1"
_transform: true

services:
  #Refer this section add your service (personal Fast API)
  - name: leaf-disease-service
    url: http://host.docker.internal:5010 # run your application in a selected port.
    routes:
      - name: leaf-disease-route
        paths:
          - /predict-leaf-disease # define a base path in your API
        strip_path: false

  - name: fruit-disease-service
    url: http://host.docker.internal:5011
    routes:
      - name: fruit-disease-route
        paths:
          - /predict-fruit-disease
        strip_path: false

  - name: pest-disease-service
    url: http://host.docker.internal:5014
    routes:
      - name: pest-disease-route
        paths:
          - /predict-pest-disease
        strip_path: false

  - name: maturity-service
    url: http://host.docker.internal:5015
    routes:
      - name: maturity-route
        paths:
          - /predict-maturity
        strip_path: false

  - name: background-service
    url: http://host.docker.internal:5080
    routes:
      - name: background-service-route
        paths:
          - /api/v1
        strip_path: false
