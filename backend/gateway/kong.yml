_format_version: "2.1"
_transform: true

services:
  - name: users-service
    url: http://users-service:8000
    routes:
      - name: users-route
        paths:
          - /api/users
        strip_path: true

  #Refer this section add your service (personal Fast API)
  - name: leaf-disease-service
    url: http://host.docker.internal:5005 # run your application in a selected port.
    routes:
      - name: leaf-disease-service
        paths:
          - /leaf-disease-predict # define a base path in your API
        strip_path: false

  - name: fruit-disease-service
    url: http://host.docker.internal:8000 # run your application in a selected port.
    routes:
      - name: fruit-disease-route
        paths:
          - /predict # define a base path in your API
        strip_path: false
