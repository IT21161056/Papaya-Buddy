name: mobile_app
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_staggered_grid_view: ^0.7.0
  carousel_slider: ^5.0.0
  lucide_icons: ^0.257.0
  flutter_animate: ^4.5.0
  http: ^1.3.0
  geolocator: ^13.0.2
  geocoding: ^3.0.0
  lottie: ^3.3.1
  intl: ^0.20.2
  async: ^2.11.0
  firebase_core: ^3.12.1
  firebase_auth: ^5.5.1
  google_sign_in: ^6.3.0
  cloud_firestore: ^5.6.5
  flutter_launcher_icons: ^0.14.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  image_picker: 1.1.2
  flutter_svg: ^2.0.9

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.jpg" # Path to your app icon
  adaptive_icon_background: "#ffffff" # (Optional) Android adaptive icon background

