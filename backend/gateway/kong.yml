_format_version: "2.1"
_transform: true

services:
  - name: users-service
    url: http://users-service:8000
    routes:
      - name: users-route
        paths:
          - /api/users
        strip_path: true

  # Refer this section add your service (personal Fast API)
  - name: disease-service
    url: http://host.docker.internal:5050 # run your application in a selected port.
    routes:
      - name: disease-route
        paths:
          - /predict # define a base path in your API
        strip_path: false
